name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/ci

env:
  IMAGE_NAME: ghcr.io/magickbase/nervos/force-bridge-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 步骤1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤2：登录 GitHub Container Registry
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USERNAME }}  # 优先使用自定义用户名
        password: ${{ secrets.GHCR_TOKEN }}  # 需要创建名为 GHCR_TOKEN 的 secret

    # 步骤3：动态修改 Dockerfile
    - name: Update Dockerfile version
      run: |
        # 使用 sed 替换 VERSION 定义
        sed -i "s/VERSION/${{ env.IMAGE_TAG }}/" Dockerfile
        
        # 验证修改结果（调试用）
        echo "Modified Dockerfile:"
        cat Dockerfile

    # 步骤4：构建并推送 Docker 镜像
    - name: Build and Push
      run: |
        IMAGETAG=$(git rev-parse --abbrev-ref HEAD)-$(git rev-parse --short=7 ${{ github.sha }})-$(TZ=Asia/Shanghai date +'%Y%m%d%H%M')

        # mainnet
        docker build -t "${{ env.IMAGE_NAME }}-mainnet:${IMAGETAG}" -f dockerfile-mainnet . 
        docker push "${{ env.IMAGE_NAME }}-mainnet:${IMAGETAG}"

        # testnet
        docker build -t "${{ env.IMAGE_NAME }}-testnet:${IMAGETAG}" -f dockerfile-testnet . 
        docker push "${{ env.IMAGE_NAME }}-testnet:${IMAGETAG}"


    # 可选步骤：输出镜像信息
    - name: Show Image Info
      run: |
        echo "Successfully pushed image:"
        echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
